name: Generar páginas de cápsulas
on:
  workflow_dispatch:
  schedule:
    # Cada hora (minuto 5): publica los episodios agendados con "hora". GitHub a veces atrasa estas ejecuciones.
    - cron: '5 * * * *'
  push:
    branches: [main]
    paths: ['capsulas.json', 'transcripciones/**', 'audio/**', 'build.mjs', 'index.html']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node build.mjs
        env:
          TMDB_KEY: ${{ secrets.TMDB_KEY }}
      - run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "Generar páginas de cápsulas" && git push)
