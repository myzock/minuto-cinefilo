name: Generar páginas de cápsulas
on:
  workflow_dispatch:
  schedule:
    # Cada hora (minuto 5): publica los episodios agendados con "hora". GitHub a veces atrasa estas ejecuciones.
    - cron: '5 * * * *'
  push:
    branches: [main]
    paths: ['capsulas.json', 'transcripciones/**', 'audio/**', 'build.mjs', 'og.mjs', 'ondas.mjs', 'index.html', 'app.js', 'package.json', 'package-lock.json']
permissions:
  contents: write
concurrency:
  group: build-web
  cancel-in-progress: false   # si ya hay un build corriendo, el nuevo espera su turno
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 20 }
      - run: npm ci --no-audit --no-fund   # instala la versión de sharp fijada en package-lock.json
      - run: command -v ffmpeg >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
      - run: node build.mjs
        env:
          TMDB_KEY: ${{ secrets.TMDB_KEY }}
      - run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "Sin cambios para publicar"; exit 0; fi
          git commit -m "Generar páginas de cápsulas"
          # Si otro push entra justo antes (carrera), se vuelve a intentar hasta 4 veces
          for intento in 1 2 3 4; do
            if git pull --rebase -X theirs origin main && git push; then exit 0; fi
            echo "::warning::Falló el push (intento $intento de 4); se reintenta"
            git rebase --abort 2>/dev/null || true
            sleep $((intento * 5))
          done
          echo "::error::No se pudo subir lo generado tras 4 intentos"
          exit 1
