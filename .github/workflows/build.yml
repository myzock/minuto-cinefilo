name: Generar páginas de cápsulas
on:
  workflow_dispatch:
  schedule:
    # Cada hora (minuto 5): publica los episodios agendados con "hora". GitHub a veces atrasa estas ejecuciones.
    - cron: '5 * * * *'
  push:
    branches: [main]
    paths: ['capsulas.json', 'transcripciones/**', 'audio/**', 'build.mjs', 'index.html', 'app.js']
permissions:
  contents: write
concurrency:
  group: build-web
  cancel-in-progress: false   # si ya hay un build corriendo, el nuevo espera su turno
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 20 }
      - run: command -v ffmpeg >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
      - run: node build.mjs
        env:
          TMDB_KEY: ${{ secrets.TMDB_KEY }}
      - run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "Generar páginas de cápsulas" && git pull --rebase -X theirs origin main && git push)
