name: Generar páginas de cápsulas
on:
  workflow_dispatch:
  schedule:
    # GitHub retrasa o saltea a veces las ejecuciones programadas: se intenta varias veces entre las 00:05 y las 02:05 de Argentina
    - cron: '5 3 * * *'
    - cron: '35 3 * * *'
    - cron: '5 4 * * *'
    - cron: '35 4 * * *'
    - cron: '5 5 * * *'
  push:
    branches: [main]
    paths: ['capsulas.json', 'transcripciones/**', 'audio/**', 'build.mjs', 'index.html']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node build.mjs
        env:
          TMDB_KEY: ${{ secrets.TMDB_KEY }}
      - run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "Generar páginas de cápsulas" && git push)
